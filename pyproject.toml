[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slip-stick"
version = "0.0.0"
description = "FTM 10 slip–stick onset detection tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Project Contributors" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black==24.8.0",
  "ruff>=0.6.2",
  "pre-commit>=3.7",
]

[project.urls]
homepage = "https://example.invalid/slip_stick"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
